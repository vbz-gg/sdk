name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run typecheck
      # The coverage floor, not just the tests. scripts/check-coverage.ts
      # reads coverage/lcov.info and holds the aggregate; bunfig.toml says
      # why no threshold lives there.
      - run: bun run test:coverage
      # Packs the package and reads the tarball's own package.json. The
      # manifest on disk is what ships, so a missing README or a dependency
      # that crept in is caught here rather than by whoever installs it.
      - run: bun run check:publishable

  browser:
    name: the browser suite
    # Playwright 1.56.1 installs no browsers on Ubuntu 26.04, which ubuntu-latest
    # now is, so a job that drives a browser names the release it supports.
    runs-on: ubuntu-24.04

    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      # Chromium, Firefox and WebKit are several hundred megabytes, so they
      # are cached by the version the lockfile pins rather than downloaded on
      # every run. Firefox and WebKit run the specs each engine decides for
      # itself: whether a studio's policy lets a game's modules and its files
      # folder's loads in, and the sign-in's box. This is the only place
      # WebKit runs.
      - name: cache the browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}

      # Through the workspace's own binary, never `bunx playwright`, which
      # resolves the newest `playwright` from the registry and downloads a
      # browser build the pinned version does not look for.
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bun run --cwd e2e install:browsers

      # The system libraries even on a cache hit: the browsers need them and
      # the cache does not carry them.
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: bun run --cwd e2e install:browser-deps

      - run: bun run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
